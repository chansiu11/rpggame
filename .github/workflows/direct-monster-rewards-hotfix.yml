name: Direct monster reward hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/direct-monster-rewards-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch direct monster rewards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index_path = Path('index.html')
          server_path = Path('multiplayer-server/server.js')
          index = index_path.read_text(encoding='utf-8')
          server = server_path.read_text(encoding='utf-8')

          def once(src, old, new, label):
              count = src.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return src.replace(old, new, 1)

          def replace_function(src, signature, new_body, label):
              start = src.find(signature)
              if start < 0:
                  raise SystemExit(f'{label}: signature not found')
              end = src.find('\nfunction ', start + len(signature))
              if end < 0:
                  raise SystemExit(f'{label}: next function not found')
              return src[:start] + new_body + src[end:]

          old_drop = "function dropMonsterLoot(x,y,kind,amount=1,serverConfirmed=false){return dropLoot(x,y,kind,amount,null,serverConfirmed,Date.now()+300000);}"
          new_drop = "function grantMonsterLoot(kind,amount=1,x=player.x,y=player.y){\n const names={gold:'골드',ore:'별철 광석',herb:'약초',potion:'회복약'};amount=Math.max(0,Math.floor(Number(amount)||0));if(!amount)return 0;let gained=amount;\n if(kind==='potion'){const before=player.potions;player.potions=Math.min(8,player.potions+amount);gained=player.potions-before;}\n else if(kind==='gold')player.gold+=amount;else if(kind==='ore')player.ore+=amount;else if(kind==='herb')player.herbs+=amount;else return 0;\n if(gained<=0)return 0;toast('<b>'+names[kind]+' 획득</b> × '+gained);sound('gather');flourish(x,y,'#f1d890',38,0);updateHUD();saveGame(false);return gained;\n}\nfunction dropMonsterLoot(x,y,kind,amount=1,serverConfirmed=false){return grantMonsterLoot(kind,amount,x,y);}"
          index = once(index, old_drop, new_drop, 'monster loot direct grant')

          old_restore = "function restoreLoot(data){if(!Array.isArray(data))return;for(const o of data.slice(0,1000)){if(!o||!['gold','ore','herb','potion'].includes(o.lootKind)||!Number.isFinite(o.x)||!Number.isFinite(o.y)||!Number.isFinite(o.amount)||o.amount<=0)continue;dropLoot(clamp(o.x,65,WORLD.w-65),clamp(o.y,65,WORLD.h-65),o.lootKind,Math.floor(clamp(o.amount,1,1e6)));}}"
          index = once(index, old_restore, "function restoreLoot(data){prepareLoot();}", 'disable saved floor loot restore')
          index = once(index, 'loot:objects.filter(o=>o.type==="loot"&&!o.fixed).map(({x,y,lootKind,amount})=>({x,y,lootKind,amount})),savedAt:', 'loot:[],savedAt:', 'stop saving floor loot')
          index = once(index, 'resetWorldState();restoreLoot(data.loot);if(solidAt(player.x,player.y,player.r))', 'resetWorldState();if(solidAt(player.x,player.y,player.r))', 'stop loading legacy floor loot')
          old_reset = "function resetWorldState(keepLoot=false){const remaining=keepLoot?objects.filter(o=>o.type==='loot'&&!o.fixed).map(({x,y,lootKind,amount})=>({x,y,lootKind,amount})):[];prepareLoot();if(keepLoot)restoreLoot(remaining);"
          index = once(index, old_reset, "function resetWorldState(keepLoot=false){prepareLoot();", 'clear floor loot on reset')

          server = once(server, "const SERVER_BUILD = '2026-10-02-pvp-basic-v4';", "const SERVER_BUILD = '2026-10-12-direct-monster-rewards-1';", 'server build marker')
          old_snapshot = "function serverWorldSnapshot(){return {ready:mobsBootstrapped,mobs:mobSnapshot(),items:worldSnapshot.items||[],updatedAt:Date.now(),revision:worldRevision,serverBuild:SERVER_BUILD,resetEpoch:WORLD_RESET_EPOCH,spawnLayoutVersion:SPAWN_LAYOUT_VERSION};}"
          new_snapshot = "function serverWorldSnapshot(){return {ready:mobsBootstrapped,mobs:mobSnapshot(),items:[],updatedAt:Date.now(),revision:worldRevision,serverBuild:SERVER_BUILD,resetEpoch:WORLD_RESET_EPOCH,spawnLayoutVersion:SPAWN_LAYOUT_VERSION};}"
          server = once(server, old_snapshot, new_snapshot, 'server floor loot snapshot')
          old_world_snapshot = "function handleWorldSnapshot(player,msg){if(player.id!==worldLeaderId)return;const clean=sanitizeWorldSnapshot({items:msg.items});worldSnapshot.items=clean.items;worldSnapshot.updatedAt=Date.now();worldSnapshot.revision=++worldRevision;broadcast({type:'world:snapshot',snapshot:serverWorldSnapshot()});}"
          new_world_snapshot = "function handleWorldSnapshot(player,msg){if(player.id!==worldLeaderId)return;worldSnapshot.items=[];worldSnapshot.updatedAt=Date.now();worldSnapshot.revision=++worldRevision;broadcast({type:'world:snapshot',snapshot:serverWorldSnapshot()});}"
          server = once(server, old_world_snapshot, new_world_snapshot, 'ignore client floor loot snapshot')
          server = replace_function(server, 'function handleItemSpawn(player,msg){', 'function handleItemSpawn(player,msg){return;}', 'disable shared floor item spawn')

          index_path.write_text(index, encoding='utf-8')
          server_path.write_text(server, encoding='utf-8')

          lines = [
              "import test from 'node:test';",
              "import assert from 'node:assert/strict';",
              "import fs from 'node:fs';",
              "const html=fs.readFileSync(new URL('../index.html',import.meta.url),'utf8');",
              "const server=fs.readFileSync(new URL('../multiplayer-server/server.js',import.meta.url),'utf8');",
              "test('monster loot goes straight to the rewarded player',()=>{",
              " assert.match(html,/function grantMonsterLoot\\(/);",
              " assert.match(html,/function dropMonsterLoot\\([^)]*\\)\\{return grantMonsterLoot\\(kind,amount,x,y\\);\\}/);",
              " assert.doesNotMatch(html,/function dropMonsterLoot\\([^}]*dropLoot\\(/);",
              "});",
              "test('legacy ground loot is not persisted or restored',()=>{",
              " assert.match(html,/loot:\\[\\],savedAt:/);",
              " assert.doesNotMatch(html,/resetWorldState\\(\\);restoreLoot\\(data\\.loot\\)/);",
              " assert.match(html,/function resetWorldState\\(keepLoot=false\\)\\{prepareLoot\\(\\);/);",
              "});",
              "test('shared server no longer republishes ground loot',()=>{",
              " assert.match(server,/mobs:mobSnapshot\\(\\),items:\\[\\]/);",
              " assert.match(server,/function handleItemSpawn\\(player,msg\\)\\{return;\\}/);",
              " assert.match(server,/2026-10-12-direct-monster-rewards-1/);",
              "});",
              ""
          ]
          Path('tests/direct-monster-rewards.test.mjs').write_text('\n'.join(lines), encoding='utf-8')
          PY
      - name: Validate scripts and reward behavior
        shell: bash
        run: |
          node --test tests/direct-monster-rewards.test.mjs
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)].filter(m=>!(/\bsrc\s*=/.test(m[1]||''))).map(m=>m[2]);
          for(let i=0;i<scripts.length;i++){
            try{new Function(scripts[i]);}
            catch(e){console.error('inline script syntax failure',i,e);process.exit(1);}
          }
          console.log('inline scripts parsed:',scripts.length);
          NODE
          node --check multiplayer-server/server.js
      - name: Commit verified hotfix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/direct-monster-rewards-hotfix.yml
          git add index.html multiplayer-server/server.js tests/direct-monster-rewards.test.mjs
          git commit -m 'Grant monster rewards directly to attacker'
          git push origin HEAD:main
