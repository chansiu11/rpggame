name: Inspect knockback acknowledgement

on:
  push:
    paths:
      - '.github/workflows/remove-basic-delay-once.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show attack result and force acknowledgement ordering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          lines=s.splitlines()
          keys=["m.t==='attackResult'", "function sendAttack(", "function forceEnemyTo(", "m.t==='hitForce'", "m.t==='forceDelta'", "m.t==='forceDeltaAck'"]
          for i,line in enumerate(lines):
            if any(k in line for k in keys):
              print(f'\n--- around line {i+1} ---')
              for j in range(max(0,i-3),min(len(lines),i+4)):
                print(f'{j+1}:{lines[j]}')
          PY
      - name: Focused endpoint tests
        run: |
          cd multiplayer-server && npm ci --no-audit --no-fund && cd ..
          node --test --test-name-pattern="several forced deltas accumulate|settlement result corrects local coordinates|Gale 4 world releases|Gale 4 PVP sends" tests/world-combat.test.mjs tests/combat-latency.test.mjs tests/gale-control-regression.test.cjs
