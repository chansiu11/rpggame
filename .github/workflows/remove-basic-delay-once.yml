name: Remove basic attack delay once

on:
  push:
    paths:
      - '.github/workflows/remove-basic-delay-once.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show current world and PvP basic timing expressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for start,end,label in [('function attack(){','function useSkill(','WORLD'),('function basic(){','function potion(){','PVP')]:
            a=s.index(start); b=s.index(end,a); sec=s[a:b]
            print('---',label,'---')
            for part in sec.split(';'):
              if any(k in part for k in ['attackCd=','exhaust=','attackDuration=','attackAnim=','comboTimer=']):
                print(part.strip()+';')
          PY
