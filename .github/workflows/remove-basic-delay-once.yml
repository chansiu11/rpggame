name: Remove basic attack delay once

on:
  push:
    paths:
      - '.github/workflows/remove-basic-delay-once.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show exact basic timing lines
        run: |
          echo '--- attackCd ---'
          grep -n "attackCd=" index.html | head -80 || true
          echo '--- pending basic ---'
          grep -n -E "pendingBasic|pendingBasicAttack|exhaust=2|comboTimer=.12" index.html | head -120 || true
