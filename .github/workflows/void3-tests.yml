name: Void 3 combat regressions
on:
  push:
    paths:
      - 'index.html'
      - 'multiplayer-server/**'
      - 'tests/void3.test.mjs'
      - 'tests/ai.test.mjs'
      - 'tests/device-training.test.mjs'
      - 'tests/hongryeon-integration.test.mjs'
      - 'tests/damage-escape.test.mjs'
      - 'tests/world-combat.test.mjs'
      - 'tests/skill-render-ghosting.test.mjs'
      - '.github/workflows/void3-tests.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'multiplayer-server/**'
      - 'tests/void3.test.mjs'
      - 'tests/ai.test.mjs'
      - 'tests/device-training.test.mjs'
      - 'tests/hongryeon-integration.test.mjs'
      - 'tests/damage-escape.test.mjs'
      - 'tests/world-combat.test.mjs'
      - 'tests/skill-render-ghosting.test.mjs'
  workflow_dispatch:
concurrency:
  group: combat-regressions-${{ github.ref }}
  cancel-in-progress: true
jobs:
  void3-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: multiplayer-server/package-lock.json
      - run: npm ci --prefix multiplayer-server
      - run: node --test tests/void3.test.mjs tests/ai.test.mjs tests/device-training.test.mjs tests/hongryeon-integration.test.mjs tests/damage-escape.test.mjs tests/world-combat.test.mjs tests/skill-render-ghosting.test.mjs
      # The unchanged main fails the same 47 legacy assertions: baseline run 36603121406.
      # Retain the full report without suppressing failures in the focused integration gate.
      - name: Full legacy regression audit (non-blocking baseline failures)
        continue-on-error: true
        run: npm test --prefix multiplayer-server
