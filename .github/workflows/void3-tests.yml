name: Combat regressions
on:
  push:
    paths:
      - 'index.html'
      - 'multiplayer-server/**'
      - 'tests/void3.test.mjs'
      - 'tests/ai.test.mjs'
      - 'tests/device-training.test.mjs'
      - 'tests/neural-ai-smoke.test.mjs'
      - 'tests/hongryeon-integration.test.mjs'
      - 'tests/damage-escape.test.mjs'
      - 'tests/world-combat.test.mjs'
      - 'tests/skill-render-ghosting.test.mjs'
      - '.github/workflows/void3-tests.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'multiplayer-server/**'
      - 'tests/void3.test.mjs'
      - 'tests/ai.test.mjs'
      - 'tests/device-training.test.mjs'
      - 'tests/neural-ai-smoke.test.mjs'
      - 'tests/hongryeon-integration.test.mjs'
      - 'tests/damage-escape.test.mjs'
      - 'tests/world-combat.test.mjs'
      - 'tests/skill-render-ghosting.test.mjs'
      - '.github/workflows/void3-tests.yml'
  workflow_dispatch:
concurrency:
  group: combat-regressions-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ai-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: multiplayer-server/package-lock.json
      - run: npm ci --prefix multiplayer-server
      - run: node --test tests/neural-ai-smoke.test.mjs tests/ai.test.mjs tests/device-training.test.mjs

  combat-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: multiplayer-server/package-lock.json
      - run: npm ci --prefix multiplayer-server
      - run: node --test tests/void3.test.mjs tests/hongryeon-integration.test.mjs tests/damage-escape.test.mjs tests/world-combat.test.mjs tests/skill-render-ghosting.test.mjs

  legacy-audit:
    needs: [ai-regressions, combat-regressions]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: multiplayer-server/package-lock.json
      - run: npm ci --prefix multiplayer-server
      - name: Full legacy regression audit
        continue-on-error: true
        run: npm test --prefix multiplayer-server
