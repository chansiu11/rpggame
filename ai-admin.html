<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 훈련 관리</title>
<style>body{background:#101c24;color:#e1eae4;font:16px system-ui;max-width:1000px;margin:40px auto;padding:20px}input,button{padding:12px;margin:5px;border-radius:6px;border:1px solid #51696b;background:#20333c;color:inherit}input{width:min(90%,420px)}button{cursor:pointer}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #46575c}pre{white-space:pre-wrap}#status{line-height:1.8;color:#b8dfd1}</style>
<h1>AI 훈련 관리</h1><p>질풍 · 이형 · 여명 / 서버 자동 훈련 · 25전마다 저장</p>
<label>훈련 서버 주소 <input id="url" type="url" placeholder="https://훈련서버.onrender.com"></label><br>
<label>관리자 토큰 <input id="token" type="password" autocomplete="off" placeholder="서버에 설정한 관리자 토큰"></label>
<p>토큰은 이 화면 메모리에서만 사용합니다. 별도 훈련 서버와 Firebase 서버 인증 설정이 필요합니다.</p>
<div id="actions"><button data-action="status">현황 새로고침</button><button data-action="start">자동 훈련 시작</button><button data-action="stop">중지·배치 저장</button><button data-action="save">저장</button><button data-action="load">불러오기</button><button data-action="versions">버전 비교</button></div>
<p id="status" role="status">서버 주소와 토큰을 입력하세요.</p><table><thead><tr><th>유파</th><th>훈련</th><th>승률</th><th>공격 적중률*</th><th>방어/패링</th><th>전술 가중치</th></tr></thead><tbody id="rows"></tbody></table><p>* 공격 메시지에 대한 판정 기준. 투사체 피해는 총 피해량에 포함됩니다.</p><pre id="evaluation"></pre><div id="versions"></div><p><a href="./index.html">게임으로 돌아가기</a></p>
<script>
const $=id=>document.getElementById(id);let active=false;
async function api(path,method='GET'){const base=$('url').value.trim().replace(/\/$/,'');if(!/^https:\/\//.test(base))throw Error('HTTPS 훈련 서버 주소를 입력하세요.');const r=await fetch(base+'/'+path,{method,headers:{Authorization:'Bearer '+$('token').value},signal:AbortSignal.timeout(20000)});const d=await r.json();if(!r.ok)throw Error(d.error||'서버 오류');return d;}
async function status(){const s=await api('status');$('status').textContent=`${s.running?'훈련 중':s.draining?'중지 중 · 현재 배치 완료 후 저장':'중지'} · 누적 ${s.progress}전 · 저장 ${s.savedMatches}전 · 버전 ${s.policy.generation} ${s.error?' / '+s.error:''}`;active=s.running||s.draining;const rows=[];for(const [id,p] of Object.entries(s.policy.styles)){const tr=document.createElement('tr');for(const value of [{gale:'질풍',void:'이형',dawn:'여명',break:'홍련'}[id],p.games,(100*p.wins/Math.max(1,p.games)).toFixed(1)+'%',(100*(p.metrics.hits||0)/Math.max(1,p.metrics.attempts||0)).toFixed(1)+'%',`${p.metrics.defenses||0} / ${p.metrics.parries||0}`,p.weights.map(v=>v.toFixed(2)).join(' / ')]){const td=document.createElement('td');td.textContent=value;tr.appendChild(td)}rows.push(tr)}$('rows').replaceChildren(...rows);$('evaluation').textContent='이전 버전과 비교\n'+JSON.stringify(s.policy.evaluation||'아직 검증 기록 없음',null,2);}
$('actions').onclick=async e=>{const a=e.target.dataset.action;if(!a)return;try{if(a==='versions'){const d=await api('versions');$('versions').replaceChildren();for(const v of d.versions){const p=document.createElement('p');p.textContent=`${v.id} · ${v.matches}전 · ${JSON.stringify(v.evaluation||{})} `;const b=document.createElement('button');b.textContent='이 버전 복원';b.onclick=async()=>{try{await api('restore/'+encodeURIComponent(v.id),'POST');await status()}catch(e){$('status').textContent=e.message}};p.appendChild(b);$('versions').appendChild(p)}}else{if(a!=='status')await api(a,'POST');await status()}}catch(e){$('status').textContent=e.message}};
setInterval(()=>{if(active&&!document.hidden)status().catch(e=>$('status').textContent=e.message)},5000);
</script></html>
